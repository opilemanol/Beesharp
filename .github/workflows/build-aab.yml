name: Build Signed Release AAB

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEYSTORE_PATH: ${{ github.workspace }}/my-upload-keybeesharp.jks

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      # Automatically generates a brand-new, unique keystore file in the cloud if it doesn't exist!
      - name: Generate Fresh Keystore File
        run: |
          if [ ! -f "$KEYSTORE_PATH" ]; then
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias upload \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Teramayo, O=Beesharp, C=NG"
          fi

      - name: Build Signed Release AAB
        run: gradle bundleRelease -Djava.security.properties=/dev/null --stacktrace

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: app/build/outputs/bundle/release/app-release.aab

      # Safe backup so you can download your brand-new unique keystore directly from GitHub!
      - name: Upload Generated Keystore Backup
        uses: actions/upload-artifact@v4
        with:
          name: save-this-keystore
          path: my-upload-keybeesharp.jks
